server:
  port: 8080

spring:
  application:
    name: api-gateway

  ldap:
    urls: ldap://openldap:389
    base: dc=booking,dc=com
    username: cn=admin,dc=booking,dc=com
    password: SecretAdminPassword123

  cloud:
    gateway:
      default-filters:
        - name: DedupeResponseHeader
          args:
            strategy: RETAIN_FIRST
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers

      routes:
        # 1. Internal Login Engine Routing
        - id: gateway-login-route
          uri: forward:///api/v1/auth
          predicates:
            - Path=/api/v1/auth/login, /api/v1/auth/logout

        # 2. Third-Party Auth Registration Proxy Mapping
        - id: registration-service-route
          uri: http://ticket-registration-service:5000
          predicates:
            - Path=/api/v1/auth/register

        # 3. Secure Booking & Movie Management Core Service (Protected by LDAP wall, no roles required)
        - id: booking-service
          uri: http://ticket-booking-service:8081
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/movies/**
          filters:
            - name: JwtAuthenticationFilter

        # 4. Secure Chat AI Python Engine Integration Mapping Rules
        - id: chat_ai_route
          uri: http://ticket-chat-ai-service:8000
          predicates:
            - Path=/api/chat/**
          filters:
            - name: JwtAuthenticationFilter
            - StripPrefix=1

        # 5. Non-Blocking Chat AI Websocket Layer Loop Tunneling
        - id: chat_ai_websocket_route
          uri: ws://ticket-chat-ai-service:8000
          predicates:
            - Path=/api/chat/ws/*

jwt:
  secret: "YOUR_SUPER_LONG_SECRET_KEY_MUST_BE_AT_LEAST_32_BYTES_LONG!"
  expiration: 86400000 # 24 Hours in milliseconds

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: TRACE
    com.ticket: DEBUG
