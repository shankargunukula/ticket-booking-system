spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # 🚀 ADD THIS DEFAULT FILTERS ARRAY BLOCK TO CLEAN INBOUND TRAFFIC
      default-filters:
        - name: DedupeResponseHeader
          args:
            strategy: RETAIN_FIRST
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers

      routes:
        # 🚀 ADD THIS AUTH ROUTE BLOCK BELOW YOUR EXISTING BOOKING ROUTE ENTRIES
        - id: registration-service-route
          uri: http://ticket-registration-service:5000
          predicates:
            - Path=/api/v1/auth/**
            # 🚀 FIXED ROUTE CACHE SYNTAX
          filters:
            - name: CacheRequestBody
              args:
                bodyClass: java.lang.String

        # 2. OTP ENGINE ROUTE (Kept on Notification service if needed)
        - id: notification-otp
          uri: http://tbs-notification-service:8082
          predicates:
            - Path=/api/v1/otp/**

        # 3. PROTECTED MICROSERVICE ROUTE
        - id: booking-service
          uri: http://ticket-booking-service:8081
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - AuthenticationFilter  # Runs token validation checks
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"  # Points straight to your React dev port
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
        add-to-simple-url-handler-mapping: true
jwt:
  secret: "YOUR_32_BYTE_LONG_SECURE_HMAC_ENCRYPTION_SECRET_KEY"
  expiration: 86400000 # Token valid for 24 Hours

management:
  otlp:
    tracing:
      # This syntax checks for the Docker environment variable first, then defaults to container link
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://ticket-zipkin:9411/api/v2/spans}

logging:
  pattern:
    # Appends app-name, traceId, and spanId properties natively directly onto console log logs
    level: "%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: INFO
    com.ticket.gateway: DEBUG  # Ensures your custom filter log statements print safely

