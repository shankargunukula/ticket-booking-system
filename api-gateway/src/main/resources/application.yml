spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # 1. PUBLIC AUTH ROUTE (Exposed to Mobile Clients)
        - id: notification-auth
          uri: http://tbs-notification-service:8082
          predicates:
            - Path=/api/v1/auth/**, /api/v1/otp/**

        # 2. PROTECTED MICROSERVICE ROUTE
        - id: booking-service
          uri: http://ticket-booking-service:8081
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - AuthenticationFilter  # This runs the token validation checks

jwt:
  secret: "YOUR_32_BYTE_LONG_SECURE_HMAC_ENCRYPTION_SECRET_KEY"
  expiration: 86400000 # Token valid for 24 Hours