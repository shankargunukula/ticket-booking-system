spring:
  application:
    name: api-gateway
  # 🚀 LDAP CLIENT CONFIGURATIONS
  ldap:
    urls: ldap://openldap:389
    base: dc=booking,dc=com
    username: cn=admin,dc=booking,dc=com
    password: SecretAdminPassword123
  cloud:
    gateway:
      # DEFAULT FILTERS ARRAY BLOCK TO CLEAN INBOUND TRAFFIC
      default-filters:
        - name: DedupeResponseHeader
          args:
            strategy: RETAIN_FIRST
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers

      routes:
        # 1. AUTH / REGISTRATION ROUTE BLOCK
        - id: registration-service-route
          uri: http://ticket-registration-service:5000
          predicates:
            - Path=/api/v1/auth/register
          filters:
            - name: CacheRequestBody
              args:
                bodyClass: java.lang.String

        # 2. OTP ENGINE ROUTE
        - id: notification-otp
          uri: http://tbs-notification-service:8082
          predicates:
            - Path=/api/v1/otp/**

        # 3. FIXED: PROTECTED MICROSERVICE ROUTE FOR MOVIES AND BOOKINGS
        - id: booking-service
          uri: http://ticket-booking-service:8081
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/movies/**
          filters:
            # FIX 1: Enforce correct custom filter factory binding layout mapping rules
            - name: AuthenticationFilter
            # OPTIONAL FIX 2: If ticket-booking-service maps endpoints from the root context internally,
            # uncomment the StripPrefix filter below to strip out the leading segments:
            # - StripPrefix=2

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"  # Points straight to your React dev port
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
        add-to-simple-url-handler-mapping: true
jwt:
  secret: "YOUR_32_BYTE_LONG_SECURE_HMAC_ENCRYPTION_SECRET_KEY"
  expiration: 86400000 # Token valid for 24 Hours

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: TRACE # Increased to TRACE level to print step-by-step routing loops
    com.ticket.gateway: DEBUG

