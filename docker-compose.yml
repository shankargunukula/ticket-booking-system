networks:
  ticket-network:
    driver: bridge

volumes:
  redis-data:
    driver: local

services:
  # 1. In-Memory Data Store & Fast Seat Locking Engine
  redis:
    image: redis:7.2-alpine
    container_name: ticket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ticket-network
    restart: always

  # 2. Async Message Broker Infrastructure (Zookeeper + Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ticket-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - ticket-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ticket-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ticket-network

  # 3. Core Ticket Booking Service Engine
  booking-service:
    build: ./booking-service
    container_name: ticket-booking-service
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/postgres?options=-c%20search_path=public
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=system
    networks:
      - ticket-network

  # 4. Open-Source API Edge Gateway
  api-gateway:
    build: ./api-gateway
    container_name: ticket-api-gateway
    ports:
      - "8080:8080"
    volumes:
      # Maps local .m2 directory into the Linux container
      - ~/.m2:/root/.m2
    depends_on:
      redis:
        condition: service_started
      booking-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_REDIS_HOST=redis
      - NOTIFICATION_SERVICE_URL=http://tbs-notification-service:8082
      - BOOKING_SERVICE_URL=http://ticket-booking-service:8081
    networks:
      - ticket-network

  # 5. Production-Ready Stable Open Source SMSC Telecom Channel Simulator
  smpp-simulator:
    image: bitsensedev/smpp-sim:latest
    container_name: ticket-smpp-simulator
    ports:
      - "2775:2775"  # Binary TCP socket routing channel
      - "8088:8989"  # Maps management interface port
    networks:
      - ticket-network
    restart: always

  # 6. Notification Hub Core Microservice
  notification-service:
    build: ./notification-service
    container_name: tbs-notification-service
    ports:
      - "8082:8082"
    volumes:
      - ~/.m2:/root/.m2
    environment:
      - SERVER_PORT=8082
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SMPP_HOST=smpp-simulator
      - SMPP_PORT=2775
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=your-email@gmail.com
      - SMTP_PASSWORD=your-app-password
    depends_on:
      redis:
        condition: service_started
      smpp-simulator:
        condition: service_started
    networks:
      - ticket-network
    restart: on-failure

  # 7. Time-Series Database for k6 Metrics
  influxdb:
    image: influxdb:1.8
    container_name: ticket-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    networks:
      - ticket-network

  # 8. Metrics Visualization UI
  grafana:
    image: grafana/grafana:10.2.2
    container_name: ticket-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    depends_on:
      - influxdb
    networks:
      - ticket-network

  # 9. Performance & Load Testing Container
  k6:
    image: grafana/k6:latest
    container_name: ticket-k6
    volumes:
      - ./scripts:/scripts
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    command: run /scripts/test.js
    depends_on:
      - influxdb
      - api-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ticket-network

  # 10. Centralized Distributed Tracing Engine Dashboard
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: ticket-zipkin
    ports:
      - "9411:9411"
    networks:
      - ticket-network
    restart: always
