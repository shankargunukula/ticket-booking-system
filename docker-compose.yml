networks:
  ticket-network:
    driver: bridge

services:
  # 1. In-Memory Data Store & Fast Seat Locking Engine
  redis:
    image: redis:7.2-alpine
    container_name: ticket-redis
    ports:
      - "6379:6379"
    networks:
      - ticket-network

  # 2. Async Message Broker Infrastructure (Zookeeper + Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ticket-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - ticket-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ticket-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ticket-network

  # 3. Core Ticket Booking Service Engine
  booking-service:
    build: ./booking-service
    container_name: ticket-booking-service
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway" # 🌟 Allows container to see your local PC apps
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # 🌟 TARGET FIXED: Explicitly routes connection traffic to /postgres database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/postgres?options=-c%20search_path=public
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=system
    networks:
      - ticket-network

  # 4. Open-Source API Edge Gateway
  api-gateway:
    build: ./api-gateway
    container_name: ticket-api-gateway
    ports:
      - "8080:8080" # External Entry Point for Postman/Users
    depends_on:
      - redis
      - booking-service
    environment:
      - SPRING_DATA_REDIS_HOST=redis
    networks:
      - ticket-network

  # 🌟 FIX: Grafana can now find and attach to the prometheus service block cleanly
  grafana:
    image: grafana/grafana:10.2.2
    container_name: ticket-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb
    networks:
      - ticket-network

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    networks:
      - ticket-network

  k6:
    image: grafana/k6:latest
    volumes:
      - ./scripts:/scripts
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    command: run /scripts/test.js
    depends_on:
      - influxdb
    networks:
      - ticket-network
