networks:
  ticket-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  ldap_data:
    driver: local
  ldap_config:
    driver: local
  ollama_storage:   # Preserves downloaded model assets across builds
  chroma_storage:   # Ensures persistent storage permissions line up accurately

services:

  # 12. OpenLDAP Directory Server
  openldap:
    image: osixia/openldap:latest
    container_name: ticket-openldap
    ports:
      - "389:389"
      - "636:636"
    environment:
      - LDAP_ORGANISATION=BookingSystem
      - LDAP_DOMAIN=booking.com
      - LDAP_ADMIN_PASSWORD=SecretAdminPassword123
    healthcheck:
      test: ["CMD-SHELL", "pidof slapd || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - ticket-network
    restart: always

  # 13. phpLDAPadmin
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: ticket-phpldapadmin
    ports:
      - "6443:443"
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=true
    depends_on:
      - openldap
    networks:
      - ticket-network
    restart: always

  # 1. In-Memory Data Store & Fast Seat Locking Engine
  redis:
    image: redis:7.2-alpine
    container_name: ticket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ticket-network
    restart: always

  # 2. Async Message Broker Infrastructure (Zookeeper + Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ticket-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - ticket-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ticket-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ticket-network

  # 3. Core Ticket Booking Service Engine
  booking-service:
    build: ./booking-service
    container_name: ticket-booking-service
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    volumes:
      # 👇 MOUNT YOUR WINDOWS MAVEN CACHE INTO THE CONTAINER
      - C:\Users\Gopi\.m2:/root/.m2
    environment:
      - SERVER_PORT=8081
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/postgres?options=-c%20search_path=public
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=system
      - JAVA_OPTS=-XX:+UseParallelGC -Xms64m -Xmx256m
    networks:
      - ticket-network

  # 4. Open-Source API Edge Gateway
  api-gateway:
    build: ./api-gateway
    container_name: ticket-api-gateway
    ports:
      - "8080:8080"
    volumes:
      # 👇 MOUNT YOUR WINDOWS MAVEN CACHE INTO THE CONTAINER
      - C:\Users\Gopi\.m2:/root/.m2
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 300M
    depends_on:
      redis:
        condition: service_started
      booking-service:
        condition: service_started
      registration-service:
        condition: service_started
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_REDIS_HOST=redis
      - NOTIFICATION_SERVICE_URL=http://tbs-notification-service:8082
      - BOOKING_SERVICE_URL=http://ticket-booking-service:8081
      - AUTH_SERVICE_URL=http://ticket-registration-service:5000
      - JAVA_OPTS=-XX:+UseParallelGC -Xms64m -Xmx256m
    networks:
      - ticket-network

  # 11. Custom Identity Provider & User Directory Auth Backend
  registration-service:
    build: ./registration-service
    container_name: ticket-registration-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - LDAP_URL=ldap://openldap:389
      - LDAP_ADMIN_DN=cn=admin,dc=booking,dc=com
      - LDAP_ADMIN_PASSWORD=SecretAdminPassword123
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - ticket-network
    restart: always

  # 14. Chat AI Python Service Engine
  chat-ai-service:
    build:
      context: ./chat-ai-python-service
      dockerfile: Dockerfile
    container_name: ticket-chat-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./chat-ai-python-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_HOST=redis
    volumes:
      - ./chat-ai-python-service/app:/workspace/app
    depends_on:
      redis:
        condition: service_started
    networks:
      - ticket-network
    restart: unless-stopped

